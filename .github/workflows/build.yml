name: Test va build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.5.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Godot keshi
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-v1

      - name: Godot o'rnatish
        run: |
          if [ ! -f ~/godot/godot ]; then
            mkdir -p ~/godot && cd ~/godot
            wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
            unzip -q Godot_*.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && rm -f *.zip
            wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
            mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
            unzip -q *.tpz && mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/ && rm -rf templates *.tpz
          fi
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Resurslarni import qilish
        run: godot --headless --import || true

      - name: Unit testlar
        run: godot --headless --path . -s res://tests/run_tests.gd

      - name: Smoke test (barcha sahnalar)
        run: tools/smoke_test.sh

      - name: Android sozlash
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/debug.keystore" \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.5.tres

      - name: Eksport (Android APK va Web)
        run: |
          mkdir -p build/android build/web
          godot --headless --export-debug "Android" build/android/jahongirlar-debug.apk
          godot --headless --export-release "Web" build/web/index.html
          ls -la build/android build/web

      - uses: actions/upload-artifact@v4
        with:
          name: jahongirlar-android
          path: build/android/jahongirlar-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jahongirlar-web
          path: build/web

      - name: Sinov APK'ni Releases'ga joylash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-latest -y --cleanup-tag || true
          gh release create dev-latest build/android/jahongirlar-debug.apk \
            --prerelease --target "${GITHUB_SHA}" \
            --title "Sinov versiyasi (avtomatik, ${GITHUB_REF_NAME})" \
            --notes "Har push'dan keyin avtomatik yig'iladi. Telefonga o'rnatish: APK'ni yuklab oling va oching (noma'lum manbalardan o'rnatishga ruxsat bering)."
