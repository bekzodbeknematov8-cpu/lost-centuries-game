name: Release AAB (Google Play)

# Qo'lda (Actions → Release AAB → Run workflow) yoki v* tegi qo'yilganda ishlaydi.
# Imzolash kaliti FAQAT GitHub Secrets orqali beriladi (repo'ga hech qachon commit qilinmaydi):
#   RELEASE_KEYSTORE_BASE64   — keystore faylining base64 ko'rinishi
#   RELEASE_KEYSTORE_PASSWORD — keystore paroli
#   RELEASE_KEY_ALIAS         — kalit nomi (alias)
# Sirlar bo'lmasa, sinov uchun vaqtinchalik kalit bilan yig'iladi (Play'ga yuklab bo'lmaydi).

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (har yuklashda oshib borishi kerak)"
        required: true
        default: "10"
      version_name:
        description: "versionName"
        required: true
        default: "1.0.0"
  push:
    tags: ["v*"]
    # Eksport sozlamalari o'zgarganda AAB yig'ilishini tekshirish (sinov kaliti bilan)
    branches: ["ccr-bda5a1f1-quipbg"]
    paths: [".github/workflows/release.yml", "export_presets.cfg"]

permissions:
  contents: read

env:
  GODOT_VERSION: 4.5.1

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Godot keshi
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-v1

      - name: Godot o'rnatish
        run: |
          if [ ! -f ~/godot/godot ]; then
            mkdir -p ~/godot && cd ~/godot
            wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
            unzip -q Godot_*.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && rm -f *.zip
            wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
            mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
            unzip -q *.tpz && mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/ && rm -rf templates *.tpz
          fi
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Testlar (release faqat testlar o'tsa)
        run: |
          godot --headless --import || true
          tools/run_tests.sh

      - name: Android SDK va Godot sozlamalari
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null || true
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/debug.keystore" \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.5.tres

      - name: Imzolash kaliti (GitHub Secrets)
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "SIGNED_FOR_PLAY=1" >> "$GITHUB_ENV"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 yo'q — vaqtinchalik kalit bilan sinov build (Play'ga yuklab bo'lmaydi)"
            KS_PASS="testpass123"; KS_ALIAS="test"
            keytool -keyalg RSA -genkeypair -alias "$KS_ALIAS" -keypass "$KS_PASS" -keystore "$KS" \
              -storepass "$KS_PASS" -dname "CN=Test,O=Test,C=UZ" -validity 9999
            echo "SIGNED_FOR_PLAY=0" >> "$GITHUB_ENV"
          fi
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KS_ALIAS" >> "$GITHUB_ENV"
          echo "::add-mask::$KS_PASS"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"

      - name: Versiya
        run: |
          CODE="${{ github.event.inputs.version_code }}"; NAME="${{ github.event.inputs.version_name }}"
          if [ -z "$CODE" ]; then CODE=$(( $(git rev-list --count HEAD) + 10 )); NAME="${GITHUB_REF_NAME#v}"; fi
          python3 - "$CODE" "$NAME" <<'PY'
          import sys, re
          code, name = sys.argv[1], sys.argv[2]
          s = open("export_presets.cfg").read()
          head, sep, tail = s.partition('name="Android AAB"')
          tail = re.sub(r'version/code=\d+', f'version/code={code}', tail, count=1)
          tail = re.sub(r'version/name="[^"]*"', f'version/name="{name}"', tail, count=1)
          open("export_presets.cfg", "w").write(head + sep + tail)
          print("versionCode", code, "versionName", name)
          PY

      - name: Android build shabloni va AAB eksport
        run: |
          mkdir -p build/release
          godot --headless --path . --install-android-build-template --export-release "Android AAB" build/release/jahongirlar.aab
          ls -la build/release
          test -s build/release/jahongirlar.aab

      - uses: actions/upload-artifact@v4
        with:
          name: jahongirlar-release-aab${{ env.SIGNED_FOR_PLAY == '1' && '' || '-TEST-KEY' }}
          path: build/release/jahongirlar.aab
